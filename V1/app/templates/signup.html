{% extends "base.html" %}

{% block content %}
    <h1>Signup</h1>

    <form method="POST">
        <label>Name</label><br>
        <input type="text" name="name"><br><br>

        <label>Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Password</label><br>
        <input type="password" name="password"><br><br>

        <button type="submit">Create Account</button>
    </form>
{% endblock %}
